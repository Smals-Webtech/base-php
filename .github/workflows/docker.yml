---
name: Docker Build images

run-name: Docker Build ${{ github.ref_name }} by @${{ github.actor }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
    branches:
      - main
      # Version branches (8.4, 8.5, ...). Without them a backport pull request
      # runs the linter only, so the change reaches its release tag having never
      # been built -- which is how the php-fpm memory cap shipped on 8.4.
      - "[0-9]+.[0-9]+"
    # No path filter here: a required check that never reports blocks the pull
    # request. The `prepare` job decides instead whether the change can reach
    # the image (see "Does the change reach the image"), and skips the build.

  push:
    branches:
      - main
      # Version branches too. A merge publishes nothing and tests nothing -- its
      # pull request did both -- it only writes the layer cache that the next
      # pull requests into that branch read.
      - "[0-9]+.[0-9]+"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

  workflow_dispatch:
    inputs:
      version:
        description: "Docker Image Version"
        required: false
        type: string
      refresh:
        description: "Rebuild the branch without the cache and write it again, publishing nothing (cache-refresh.yml, weekly)"
        required: false
        type: boolean
        default: false

# Each job asks for what it needs; everything else is read-only.
permissions:
  contents: read

env:
  # Only a release publishes: a tag, or a dispatch that names a version, from the
  # canonical repository. A fork with Actions enabled would otherwise publish
  # under the upstream production image name.
  DOCKER_IMAGE_NAME: ${{ github.repository == 'Smals-Webtech/base-php' && ((github.event_name == 'workflow_dispatch' && inputs.version) || startsWith(github.ref, 'refs/tags/')) && 'smalswebtech/base-php' || 'smalswebtech/base-php-dev' }}

jobs:
  # Decides what this run is. Four kinds, and what each one builds:
  #
  #   pull request  amd64, all targets, the suites (dev ones narrowed to the dev tag)
  #   merge         amd64, prd targets, no suites, writes the cache
  #   refresh       amd64 + arm64, all targets, no cache, full suites (arm64: smoke), writes the cache
  #   release       amd64 + arm64, all targets, no cache, full suites (arm64: smoke), publishes
  #
  # arm64 is built only by a release and the weekly refresh: nothing in a pull
  # request has ever broken on one platform alone, and a release that would is
  # stopped before it publishes, since the push job needs every build.
  prepare:
    runs-on: ubuntu-24.04

    outputs:
      push: ${{ steps.kind.outputs.push }}
      merge: ${{ steps.kind.outputs.merge }}
      tests: ${{ steps.kind.outputs.tests }}
      dev-filter: ${{ steps.kind.outputs.dev-filter }}
      platforms: ${{ steps.kind.outputs.platforms }}
      targets: ${{ steps.matrix.outputs.targets }}
      variants: ${{ steps.matrix.outputs.variants }}
      metadata: ${{ steps.matrix.outputs.metadata }}
      ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.version) || '' }}
      image: ${{ steps.changes.outputs.image }}

    steps:
      # What cannot change the image: a change made only of these files builds
      # nothing, and its merge rebuilds nothing. A change that also touches
      # anything else builds as usual, and so does every tag, dispatch and
      # refresh. When the list of changed files cannot be had (a new branch, an
      # API error, more files than the comparison returns), it builds too.
      - name: Does the change reach the image
        id: changes
        shell: bash
        run: |
          image=true
          case "${EVENT}" in
            pull_request) range="${BASE_SHA}...${HEAD_SHA}" ;;
            push)         [ "${REF_TYPE}" = branch ] && [ "${BEFORE}" != 0000000000000000000000000000000000000000 ] && range="${BEFORE}...${HEAD_SHA}" ;;
          esac
          if [ -n "${range:-}" ] && files=$(gh api "repos/${REPOSITORY}/compare/${range}" --jq '.files | if length < 300 then .[].filename else error("too many files") end'); then
            image=false
            while IFS= read -r f; do
              [ -n "${f}" ] || continue
              case "${f}" in
                docs/*|.vex/*|.github/renovate/*) continue ;;
                Makefile|renovate.json|.github/changelog-deps.sh) continue ;;
                .github/workflows/lint.yaml|.github/workflows/cache-refresh.yml) continue ;;
                .github/workflows/renovate.yml|.github/workflows/scan-published.yml) continue ;;
              esac
              # *.md at the root only, as the former paths-ignore entry matched.
              [[ "${f}" != */* && "${f}" == *.md ]] && continue
              echo "reaches the image: ${f}"
              image=true
              break
            done <<<"${files}"
          fi
          echo "image=${image}" | tee -a "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Decide what this run builds
        id: kind
        shell: bash
        run: |
          set -e
          release=false; refresh=false; merge=false
          if [ "${REF_TYPE}" = tag ] || [ -n "${DISPATCH_VERSION}" ]; then release=true; fi
          [ "${REFRESH}" = true ] && refresh=true
          if [ "${EVENT}" = push ] && [ "${REF_TYPE}" = branch ]; then merge=true; fi

          push=false
          [ "${release}" = true ] && [ "${REPOSITORY}" = Smals-Webtech/base-php ] && push=true

          if [ "${release}" = true ] || [ "${refresh}" = true ]; then
            platforms='["linux/amd64","linux/arm64"]'
          else
            platforms='["linux/amd64"]'
          fi

          {
            echo "push=${push}"
            echo "merge=${merge}"
            echo "tests=$([ "${merge}" = true ] && echo false || echo true)"
            echo "dev-filter=$([ "${EVENT}" = pull_request ] && echo true || echo false)"
            echo "platforms=${platforms}"
          } >> "${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_VERSION: ${{ (github.event_name == 'workflow_dispatch' && inputs.version) || '' }}
          REFRESH: ${{ inputs.refresh == true }}

      - name: List the targets
        id: matrix
        shell: bash
        run: |
          set -e
          METADATA="$(docker buildx bake --print | jq -c)"
          TARGETS=$(jq -r '.target | keys[]' <<<"${METADATA}" | grep -E '.+-.')
          # A merge only feeds the cache, and the dev images are built FROM the
          # prd ones: the prd targets are enough to carry what changed.
          [ "${MERGE}" = true ] && TARGETS=$(grep -E -- '-prd$' <<<"${TARGETS}")
          VARIANTS=$(cut -d'-' -f1 <<<"${TARGETS}" | sort -u)
          {
            echo metadata="${METADATA}"
            echo targets="$(jq -Rnc '[inputs]' <<<"${TARGETS}")"
            echo variants="$(jq -Rnc '[inputs]' <<<"${VARIANTS}")"
          } >> "${GITHUB_OUTPUT}"
        env:
          MERGE: ${{ steps.kind.outputs.merge }}
          GIT_HASH: ${{ github.sha }}
          DOCKER_IMAGE_VERSION: ${{ (github.ref_type == 'tag' && github.ref_name) || (github.event_name == 'workflow_dispatch' && inputs.version) || 'snapshot' }}

  # One job per platform builds every target in a single bake: BuildKit then
  # builds each shared stage (fpm-prd under nginx, apache and every dev image)
  # once, where one job per target built it six times on six runners.
  build:
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    needs:
      - prepare

    if: fromJson(needs.prepare.outputs.image)

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.platforms) }}

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare
        id: prepare
        run: |
          echo "sanitized_platform=${PLATFORM//\//-}" >> "${GITHUB_OUTPUT}"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        # Secrets are not exposed to pull requests from forks, so the login can
        # only fail there. Such a build never pushes anyway (push is false), so
        # skip it and let the build run with anonymous pulls. Same guard the
        # push job already carries.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # The bake overrides, one line per target for the cache.
      #
      # A cache entry is readable from the ref that wrote it, from the default
      # branch and, for a pull request, from its base branch. Every build reads
      # main's scope and its branch's own, for the target and for its prd
      # counterpart: no merge writes a dev scope any more, and a dev image is
      # built FROM the prd one, so the prd scope carries most of its layers.
      #
      # Only a merge and the weekly refresh write, amd64 only: nothing else
      # reads the cache on arm64, since a release builds without it.
      - name: Compose the bake overrides
        id: overrides
        shell: bash
        run: |
          set -e
          lines=("*.platform=${PLATFORM}")
          if [ "${PUSH}" = true ]; then
            # Tags are removed on the push path to prevent a "can't push tagged
            # ref [...] by digest" error; the push job creates them.
            lines+=("*.tags=" "*.output=type=image,name=${DOCKER_IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true")
          fi
          for t in $(jq -r '.[]' <<<"${TARGETS}"); do
            for s in $(printf '%s\n' "${t}" "${t%-*}-prd" | sort -u); do
              lines+=("${t}.cache-from=type=gha,scope=${s}-refs/heads/main-${PLATFORM}")
              if [ -n "${BRANCH}" ] && [ "${BRANCH}" != main ]; then
                lines+=("${t}.cache-from=type=gha,scope=${s}-refs/heads/${BRANCH}-${PLATFORM}")
              fi
            done
            if [ "${WRITE}" = true ] && [ "${PLATFORM}" = linux/amd64 ]; then
              lines+=("${t}.cache-to=type=gha,scope=${t}-refs/heads/${BRANCH}-${PLATFORM},ignore-error=true")
            fi
          done
          {
            echo "set<<EOF"
            printf '%s\n' "${lines[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${lines[@]}"
        env:
          PLATFORM: ${{ matrix.platform }}
          PUSH: ${{ needs.prepare.outputs.push }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
          BRANCH: ${{ github.base_ref || (github.ref_type == 'branch' && github.ref_name) || '' }}
          WRITE: ${{ github.ref_type == 'branch' && (needs.prepare.outputs.merge == 'true' || inputs.refresh == true) }}

      - name: Bake and push images
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: .
          pull: true
          # A release (a tag, or a dispatch with a version) is built from scratch.
          # The layer cache is keyed on the instruction, not on what it installs:
          # an `apk add` layer stays valid until the base image changes, so a
          # re-publication meant to ship an Alpine fix (PostgreSQL 18.7, apache
          # 2.4.71 in 2026-11) reused the old packages from main's cache and
          # published them again, without a word. The weekly refresh
          # (cache-refresh.yml) rebuilds each long-lived branch the same way and
          # writes the cache again, so it is never more than a week behind.
          no-cache: ${{ github.ref_type == 'tag' || needs.prepare.outputs.ref != '' || inputs.refresh == true }}
          # A merge runs no suite, so it loads nothing: the build is for the cache.
          load: ${{ !fromJson(needs.prepare.outputs.push) && !fromJson(needs.prepare.outputs.merge) }}
          # Attestations only on the push path. With them the result is a manifest
          # list, which the docker exporter behind `load` refuses ("docker exporter
          # does not currently support exporting manifest lists").
          sbom: ${{ fromJson(needs.prepare.outputs.push) }}
          provenance: ${{ fromJson(needs.prepare.outputs.push) }}
          targets: ${{ join(fromJson(needs.prepare.outputs.targets), ',') }}
          files: |
            docker-bake.hcl
          set: ${{ steps.overrides.outputs.set }}
        env:
          GIT_HASH: ${{ github.sha }}
          DOCKER_IMAGE_VERSION: ${{ (github.ref_type == 'tag' && github.ref_name) || needs.prepare.outputs.ref || 'snapshot' }}

      # On the push path the suites are the release gate, on both platforms. A release is built
      # without the cache, so it installs that day's Alpine packages and compiles
      # the PECL extensions again: an image no pull request has run. The images
      # were just pushed by digest, untagged; they are pulled back and tested
      # here, and the push job, which creates every tag, needs this job to pass.
      # A failure leaves the published tags where they were.
      - name: Pull the pushed images for the suites
        if: fromJson(needs.prepare.outputs.push)
        shell: bash
        run: |
          set -e
          for t in $(jq -r '.[]' <<<"${TARGETS}"); do
            digest=$(jq -r --arg t "${t}" '.[$t]."containerimage.digest"' <<<"${METADATA}")
            variant=${t%-*}; target=${t##*-}
            suffix=""; [ "${target}" = dev ] && suffix="-dev"
            docker pull --quiet --platform "${PLATFORM}" "${DOCKER_IMAGE_NAME}@${digest}"
            # A local name only: nothing is pushed under it.
            docker tag "${DOCKER_IMAGE_NAME}@${digest}" "base-php-under-test:release-${variant}${suffix}"
          done
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
          PLATFORM: ${{ matrix.platform }}

      - name: Set up bats
        id: bats
        if: fromJson(needs.prepare.outputs.tests)
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          # Pinned so a local run and a CI run exercise the same bats and the
          # same assertions; `make -C test deps` fetches these very tags.
          bats-version: 1.14.0
          support-version: 0.3.0
          assert-version: 2.2.4
          detik-install: false
          file-install: false

      # One lane per variant, side by side: the suites publish on ephemeral ports
      # and name their containers after the variant and the target. Within a lane
      # prd runs before dev, since the cli suite creates fixed-name volumes. A
      # pull request runs the dev suites narrowed to the tests tagged `dev` --
      # what the dev images add over prd; a release and the refresh run them all.
      #
      # arm64 (release and refresh only) runs the same tagged subset on every
      # target, on its native runner: versions, health, FastCGI. A smoke test,
      # so that an arm64 image that builds but does not start is never published.
      - name: Test images
        if: fromJson(needs.prepare.outputs.tests)
        working-directory: test
        shell: bash
        env:
          # The loaded snapshots on the load path, the images pulled back above on
          # the push path (see test/helpers/containers.bash image_tag).
          DOCKER_IMAGE_NAME: ${{ fromJson(needs.prepare.outputs.push) && 'base-php-under-test' || env.DOCKER_IMAGE_NAME }}
          DOCKER_IMAGE_VERSION: ${{ fromJson(needs.prepare.outputs.push) && 'release' || 'snapshot' }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
          DEV_FILTER: ${{ needs.prepare.outputs.dev-filter }}
          SMOKE: ${{ matrix.platform != 'linux/amd64' }}
          # The action exposes the install location as a step output rather than
          # exporting it, so the suites are handed it here.
          BATS_LIB_PATH: ${{ steps.bats.outputs.lib-path }}
        run: |
          mkdir -p "${RUNNER_TEMP}/bats"

          lane() {
            local variant=$1 suite=$2 target status=0
            for target in prd dev; do
              jq -e --arg t "${variant}-${target}" 'any(.[]; . == $t)' <<<"${TARGETS}" >/dev/null || continue
              local filter=()
              if [ "${SMOKE}" = true ] || { [ "${target}" = dev ] && [ "${DEV_FILTER}" = true ]; }; then
                filter=(--filter-tags dev)
              fi
              BATS_VARIANT=${variant} BATS_TARGET=${target} \
                bats --print-output-on-failure "${filter[@]}" "${suite}" \
                >"${RUNNER_TEMP}/bats/${variant}-${target}.log" 2>&1 || status=1
            done
            return "${status}"
          }

          lane cli tests.cli.bats & cli=$!
          lane apache tests.web.bats & apache=$!
          lane nginx tests.web.bats & nginx=$!

          failed=0
          for pid in "${cli}" "${apache}" "${nginx}"; do
            wait "${pid}" || failed=1
          done

          for log in "${RUNNER_TEMP}"/bats/*.log; do
            echo "::group::$(basename "${log}" .log)"
            cat "${log}"
            echo "::endgroup::"
            grep -q '^not ok' "${log}" && echo "::error::$(basename "${log}" .log): $(grep -c '^not ok' "${log}") failing test(s)"
          done
          exit "${failed}"

      - name: Export digests
        if: fromJson(needs.prepare.outputs.push)
        shell: bash
        run: |
          mkdir -p /tmp/digests
          jq -c 'with_entries(select(.value | type == "object" and has("containerimage.digest")) | .value = .value."containerimage.digest")' \
            <<<"${METADATA}" > "/tmp/digests/${SANITIZED}.json"
          cat "/tmp/digests/${SANITIZED}.json"
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          SANITIZED: ${{ steps.prepare.outputs.sanitized_platform }}

      - name: Upload digests
        if: fromJson(needs.prepare.outputs.push)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ steps.prepare.outputs.sanitized_platform }}-${{ github.sha }}
          path: /tmp/digests/${{ steps.prepare.outputs.sanitized_platform }}.json
          if-no-files-found: error
          retention-days: 1

  # Adapted from https://docs.docker.com/build/ci/github-actions/multi-platform/
  # One job for every target: a manifest list per target, from the digest each
  # platform pushed.
  push:
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write

    needs:
      - prepare
      - build

    if: fromJson(needs.prepare.outputs.push)

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create the manifest lists and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -e
          platforms=$(jq length <<<"${PLATFORMS}")
          for t in $(jq -r '.[]' <<<"${TARGETS}"); do
            mapfile -t tags < <(jq -r --arg t "${t}" '.target[$t].tags[]' <<<"${METADATA}")
            mapfile -t digests < <(jq -r --arg t "${t}" '.[$t] // empty' ./*.json)
            if [ "${#digests[@]}" -ne "${platforms}" ]; then
              echo "::error::${t}: ${#digests[@]} digest(s) for ${platforms} platform(s)" >&2
              exit 1
            fi
            echo "::group::${t}"
            # shellcheck disable=SC2046
            docker buildx imagetools create $(printf -- '-t %s ' "${tags[@]}") \
              $(printf "${DOCKER_IMAGE_NAME}@%s " "${digests[@]}")
            docker buildx imagetools inspect "${tags[0]}"
            echo "::endgroup::"
          done
        env:
          METADATA: ${{ needs.prepare.outputs.metadata }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}

  # ── Vulnerability scan of the published prd images (Trivy → Security tab) ────────────────────────
  #
  # Only the prd images: the dev ones carry Composer, the GitHub CLI and Xdebug, and they are not
  # what runs in production -- scanning them would double the job count for findings nobody acts on.
  #
  # The reference is the LAST tag of the target rather than the first: `first` is the floating
  # `:<variant>` tag, `last` is the versioned one (`8.5.10-cli`), so a result in the Security tab
  # is attributable to a release instead of to a tag that moves.
  scan:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    needs:
      - prepare
      - push

    if: fromJson(needs.prepare.outputs.push)

    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    steps:
      # Only for .vex/: the VEX document has to be on disk before Trivy runs.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve the published image
        id: image
        shell: bash
        run: |
          set -e
          ref="$(jq -cr --arg t "${VARIANT}-prd" '.target[$t].tags | last' <<< "${METADATA}")"
          if [ -z "${ref}" ] || [ "${ref}" = "null" ]; then
            echo "::error::no tag resolved for ${VARIANT}-prd" >&2
            exit 1
          fi
          echo "resolved ${VARIANT}-prd -> ${ref}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
        env:
          METADATA: ${{ needs.prepare.outputs.metadata }}
          VARIANT: ${{ matrix.variant }}

      # TRIVY_VEX, not a `with:` input: the action exposes no flag for it. The document declares the
      # gomplate findings this image does not reach; see .vex/README.md for what it claims and when
      # it must be revisited.
      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          # Without this the action ignores `severity` for SARIF output and uploads every severity,
          # so the Security tab filled with MEDIUM and UNKNOWN findings the table step never showed.
          limit-severities-for-sarif: true
          ignore-unfixed: true
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/gomplate.openvex.json

      # One category per variant: GitHub indexes code-scanning results by category, so four uploads
      # sharing one would overwrite each other and the tab would only ever show the last variant.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.variant }}

      # TRIVY_SHOW_SUPPRESSED prints what the VEX filtered out, and which statement did it, so the
      # suppression is visible in the build log rather than only in a file nobody opens.
      - name: Trivy summary (table, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/gomplate.openvex.json
          TRIVY_SHOW_SUPPRESSED: "true"

  # The one check branch protection requires. A skipped matrix job reports under
  # its bare name (`build`), not `build (linux/amd64)`, so requiring the build
  # itself would block every change that skips it. This job always runs: it
  # passes when the build passed or was skipped, and fails otherwise.
  image:
    runs-on: ubuntu-24.04

    needs:
      - prepare
      - build

    if: always()

    steps:
      - name: Result
        shell: bash
        run: |
          echo "prepare: ${PREPARE}, build: ${BUILD}"
          [ "${PREPARE}" = success ] || exit 1
          case "${BUILD}" in success|skipped) ;; *) exit 1 ;; esac
        env:
          PREPARE: ${{ needs.prepare.result }}
          BUILD: ${{ needs.build.result }}
