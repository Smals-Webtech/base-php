---
name: Lint Code Base

on:
  pull_request:
    branches:
      - main
      - 8.4

  push:
    branches:
      - main
      - 8.4

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@12150456a73e248bdc94d0794898f94e23127c88 # v7.4.0
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: /
          VALIDATE_JSCPD: false
          VALIDATE_DOCKERFILE_HADOLINT: false
          # supervisord-event-listener.py is a vendored supervisord protocol
          # helper (shared verbatim with base-nginx); pylint style rules do not
          # apply to it.
          VALIDATE_PYTHON_PYLINT: false
          # Conflicts with MARKDOWN
          VALIDATE_MARKDOWN_PRETTIER: false
          # New in super-linter v9. Formatters only: BIOME_FORMAT would rewrite the
          # VEX documents, and the Python scripts are shared verbatim with base-nginx.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # shfmt cannot parse an associative array key ending in ".enabled".
          VALIDATE_SHELL_SHFMT: false
          # TODO: enable again once its template-injection and excessive-permissions
          # findings are reviewed. The Actions are pinned by commit in the meantime.
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          FILTER_REGEX_EXCLUDE: .*test.*
