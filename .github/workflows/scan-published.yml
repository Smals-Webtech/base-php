---
name: Scan published images

run-name: Scan published images by @${{ github.actor }}

# The build scans an image once, when it is pushed. An advisory published after
# that is never seen on the image people actually pull, which is how both
# October 2026 advisories (PHP2Shell, HTTP2Shell) went unnoticed on released
# tags. This workflow scans what is published, every week, and keeps the result
# in the Security tab next to the build's.
#
# The cron runs the copy of this file on the default branch, so it scans both
# lines from there: there is nothing to backport to 8.4.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── One scan per published line and prd variant ──────────────────────────────────────────────────
  #
  # The floating `<line>-<variant>` tag is what child images and deployments pull. It is resolved to
  # its digest first and the digest is scanned, so the result names the exact image it describes even
  # if a retag moves the tag while the job runs.
  #
  # Only the prd images, as in docker.yml: the dev ones are not what runs in production.
  scan:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        line: ["8.5", "8.4"]
        variant: [cli, fpm, nginx, apache]
        include:
          - line: "8.5"
            branch: main
          - line: "8.4"
            branch: "8.4"

    steps:
      # The line's own branch: its .vex/ document is the one that matches the image, and its head
      # commit is what the analysis is filed under.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Resolve the published image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="smalswebtech/base-php:${{ matrix.line }}-${{ matrix.variant }}"
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
            echo "::error::no digest resolved for ${tag}" >&2
            exit 1
          fi
          echo "resolved ${tag} -> ${digest}"
          {
            echo "tag=${tag}"
            echo "ref=smalswebtech/base-php@${digest}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "| Scanned tag | Digest |"
            echo "| --- | --- |"
            echo "| \`${tag}\` | \`${digest}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Same settings and VEX document as the build's scan (docker.yml), so the two only differ in
      # what they scan.
      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/gomplate.openvex.json

      # What this image reports now that its previous weekly scan did not. Before the upload, so the
      # latest analysis of the category is still last week's. The comparison is per image rather than
      # by alert: an alert is one object for the whole repository, created when ANY scan first sees the
      # advisory, and the build's scan creates it without telling anyone. Going by alert dates, a CVE
      # the build saw first was never reported here.
      #
      # Without a previous analysis (the first scan, or one older than the last 100 analyses of the
      # branch), every finding counts as new: a spurious report rather than a missed one.
      - name: Compare with the previous scan of this image
        id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: refs/heads/${{ matrix.branch }}
          CATEGORY: published-${{ matrix.line }}-${{ matrix.variant }}
        run: |
          set -euo pipefail
          keys='[.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri)"] | unique | .[]'
          jq -r "${keys}" trivy.sarif | sort >current.txt
          id="$(gh api "repos/${REPO}/code-scanning/analyses?ref=${REF}&tool_name=Trivy&per_page=100" \
            --jq "[.[] | select(.category == \"${CATEGORY}\")][0].id // empty")"
          if [ -n "${id}" ]; then
            gh api -H 'Accept: application/sarif+json' "repos/${REPO}/code-scanning/analyses/${id}" |
              jq -r "${keys}" | sort >previous.txt
          else
            : >previous.txt
          fi
          comm -13 previous.txt current.txt >new.txt
          echo "count=$(wc -l <new.txt)" >>"${GITHUB_OUTPUT}"
          {
            echo
            if [ -s new.txt ]; then
              echo "**New since the previous scan of this image** (analysis ${id:-none}):"
              echo
              echo "| Advisory | Path |"
              echo "| --- | --- |"
              sed -E 's/^([^ ]+) (.*)$/| \1 | \2 |/' new.txt
            else
              echo "Nothing new since the previous scan of this image (analysis ${id})."
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      # A category of its own: `trivy-<variant>` describes what the head of main builds, this one what
      # users pull. Sharing a category would make an alert open and close at every push and every week.
      #
      # ref and sha file the analysis under the line's branch rather than under the default one, so the
      # 8.4 line shows up under the 8.4 branch filter instead of only under its release tag. An alert
      # closes by itself when a later scan of the same category no longer reports it, after a rebuild or
      # a retag.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: published-${{ matrix.line }}-${{ matrix.variant }}
          ref: refs/heads/${{ matrix.branch }}
          sha: ${{ steps.image.outputs.sha }}

      - name: Trivy summary (table, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/gomplate.openvex.json
          TRIVY_SHOW_SUPPRESSED: "true"

      # A failed scheduled run is mailed by GitHub: that is the signal. Last, so the SARIF and the
      # table are there whatever happens.
      - name: Fail on new findings
        if: steps.diff.outputs.count != '0'
        run: |
          echo "::error::${{ steps.diff.outputs.count }} new finding(s) on ${{ steps.image.outputs.tag }}, see the run summary"
          exit 1
