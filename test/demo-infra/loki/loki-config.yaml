---
# Single-binary Loki with its object store on the in-stack SeaweedFS (S3 API).
# Credentials are expanded from the environment at boot (-config.expand-env=true);
# the single source of truth is the dedicated S3 identity created by s3-init.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: seaweedfs:8333
      bucketnames: ${LOKI_S3_BUCKET_NAME}
      access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
      secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3forcepathstyle: true
      # SeaweedFS ignores it; a stricter S3 server (Garage) rejects a signature
      # made for Loki's default "dummy" region.
      region: us-east-1
      insecure: true            # reached over plain HTTP in-stack

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  delete_request_store: s3

limits_config:
  allow_structured_metadata: true
  retention_period: 168h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
